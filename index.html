   שומר {date,kind}; אין מפתח אחסון חדש. מחזיר null אם מעולם לא נעשה. */
function daysSinceDrill(kind){

const vstate={level:1,idx:0,order:[],results:[],qStart:0};
function startVocab(){
  vstate.level=1;vstate.idx=0;vstate.results=[];
  document.getElementById('topbar').style.visibility='hidden';
  renderVocabQ();
}
function renderVocabQ(){
  const q=VOCAB[vstate.level][vstate.idx];
  vstate.order=shuffle([0,1,2,3]);
  vstate.qStart=Date.now();
  const done=vstate.results.length, total=60;
  app.innerHTML='<div class="card">'+
    '<p class="sub">מילה '+(done+1)+' מתוך עד '+total+' · רמה '+vstate.level+' מתוך 5</p>'+
    '<div class="en" style="font-size:1.9rem;text-align:center;font-weight:700;margin:20px 0">'+q.w+'</div>'+
    '<p class="sub" style="text-align:center">מה פירוש המילה?</p>'+
    '<div class="opts">'+vstate.order.map((oi,vi)=>
      '<button type="button" class="opt" style="direction:rtl;text-align:right;font-family:inherit" onclick="vAnswer('+vi+')">'+
      '<span class="letter">'+['א','ב','ג','ד'][vi]+'</span><span>'+q.o[oi]+'</span></button>').join('')+
    '</div><div class="actions" style="justify-content:center">'+
    '<button class="btn ghost" onclick="vAnswer(-1)">🤷 לא יודע — הבא</button></div></div>';
}
function vAnswer(vi){
  const q=VOCAB[vstate.level][vstate.idx];
  const known=vi>=0&&vstate.order[vi]===0;
  vstate.results.push({w:q.w,t:q.o[0],level:vstate.level,known,
    skipped:vi<0,sec:Math.round((Date.now()-vstate.qStart)/1000)});
  vstate.idx++;
  if(vstate.idx>=VOCAB[vstate.level].length){
    const lv=vstate.results.filter(r=>r.level===vstate.level);
    const correct=lv.filter(r=>r.known).length;
    // רמה קרסה (4 ומטה מתוך 12) — אין טעם להמשיך לרמות קשות יותר
    if(correct<=4||vstate.level===5){vocabReport();return;}
    vstate.level++;vstate.idx=0;
  }
  renderVocabQ();
}
function vocabReport(){
  const res=vstate.results;
  const levels=[1,2,3,4,5].map(l=>{
    const rows=res.filter(r=>r.level===l);
    if(!rows.length)return null;
    return {l,total:rows.length,correct:rows.filter(r=>r.known).length};
  }).filter(Boolean);
  // "הרמה שלך" = הרמה הגבוהה ביותר עם 75%+ שליטה
  let mastered=0;
  for(const lv of levels){if(lv.correct/lv.total>=0.75)mastered=lv.l;else break;}
  const missed=res.filter(r=>!r.known);
  const testedMax=levels[levels.length-1].l;
  const result={type:'vocab',date:new Date().toISOString(),
    masteredLevel:mastered,testedUpTo:testedMax,
    levels:levels.map(x=>({level:x.l,correct:x.correct,total:x.total})),
    missed:missed.map(m=>({w:m.w,t:m.t,level:m.level}))};
  try{
    const hist=JSON.parse(localStorage.getItem('amirnet_vocab')||'[]');
    hist.push(result);localStorage.setItem('amirnet_vocab',JSON.stringify(hist));
  }catch(e){}
  window._vresult=result;
  const lvRow=(x)=>{
    const pct=Math.round(100*x.correct/x.total);
    const cls=pct>=75?'good':(pct>=50?'mid':'bad');
    return '<tr><td>רמה '+x.l+' — '+VOCAB_LEVEL_NAMES[x.l]+'</td><td>'+x.correct+' / '+x.total+
      '</td><td><span class="pill '+cls+'">'+pct+'%</span></td></tr>';
  };
  app.innerHTML=`
  <div class="card">
    <div class="score-hero">
      <div class="sub">בדיקת אוצר מילים — תוצאה</div>
      <div class="big" style="font-size:2.2rem">רמה ${mastered} מתוך 5</div>
      <div class="range">${mastered?'שליטה מלאה עד: '+VOCAB_LEVEL_NAMES[mastered]:'עוד אין רמה עם שליטה מלאה — מתחילים מהיסודות, וזה בסדר גמור'}</div>
    </div>
    <table class="rep"><tr><th>רמה</th><th>נכונות</th><th>שליטה</th></tr>${levels.map(lvRow).join('')}</table>
    ${testedMax<5?'<p class="sub" style="margin-top:10px">הבדיקה נעצרה ברמה '+testedMax+' — רמות גבוהות יותר יילמדו בהמשך, לפי הסדר.</p>':''}
  </div>
  ${missed.length?`<div class="card"><h2>המילים שנלמד ראשונות (${missed.length})</h2>
    <p class="sub">אלה המילים שלא ידעת — הן יהיו תחילת תוכנית הלימוד שלך</p>
    <table class="rep"><tr><th style="text-align:left">מילה</th><th>תרגום</th><th>רמה</th></tr>
    ${missed.map(m=>'<tr><td style="direction:ltr;text-align:left;font-family:Georgia,serif">'+m.w+'</td><td>'+m.t+'</td><td>'+m.level+'</td></tr>').join('')}</table>
  </div>`:''}
  <div class="card">
    <h2>מה עכשיו?</h2>
    <p>לחץ "העתק תוצאה" והדבק לי בשיחה — לפי זה אבנה את מערכת המילים שלך. אחר-כך, כשתרגיש מוכן, עשה גם את הסימולציה המלאה (שלב ב').</p>
    <div class="actions">
      <button class="btn" onclick="copyVocab(this)">📋 העתק תוצאה</button>
      <button class="btn ghost" onclick="intro()">חזרה לתפריט</button>
    </div>
  </div>`;
}
function copyVocab(btn){
  const r=window._vresult;
  const txt='תוצאת בדיקת אוצר מילים — '+new Date(r.date).toLocaleString('he-IL')+'\n'+
    'רמת שליטה: '+r.masteredLevel+'/5 (נבדק עד רמה '+r.testedUpTo+')\n'+JSON.stringify(r);
  const done=()=>{btn.textContent='✓ הועתק — הדבק בשיחה';};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));
  }else fallbackCopy(txt,done);
}

/* ============ בניית פרקים (אדפטיבי) ============ */
function buildAndStart(){
  state.chapters=[
    {skill:'sc',name:'השלמת משפטים · פרק 1',time:240,pick:()=>SC[state.scBand].map(q=>({...q,d:state.scBand}))},
    {skill:'rs',name:'ניסוח מחדש · פרק 1',time:360,pick:()=>RS.M.slice()},
    {skill:'sc',name:'השלמת משפטים · פרק 2',time:240,pick:()=>SC[state.scBand].map(q=>({...q,d:state.scBand}))},
    {skill:'rc',name:'הבנת הנקרא',time:900,pick:pickPassage},
    {skill:'rs',name:'ניסוח מחדש · פרק 2',time:360,pick:()=>state.rsCorrect>=2?RS.H.slice():RS.L.slice()},
    {skill:'sc',name:'השלמת משפטים · פרק 3',time:240,pick:()=>SC[state.scBand].map(q=>({...q,d:state.scBand}))}
  ];
  document.getElementById('topbar').style.visibility='visible';
  drawDots();
  nextChapter();
}
function pickPassage(){
  const acc=state.maxSeen>0?state.earned/state.maxSeen:0;
  const p=acc>=0.6?READING.H:READING.M;
  state.passage=p;
  return p.qs.map(q=>({s:q.q,o:q.o,c:q.c,d:p.d,tag:q.tag}));
}

/* ============ ניהול פרק ============ */
function nextChapter(){
  if(state.timerId){clearInterval(state.timerId);state.timerId=null;}
  state.chIdx++;
  if(state.chIdx>=state.chapters.length){report();return;}
  const ch=state.chapters[state.chIdx];
  state.qs=ch.pick();
  state.qIdx=0; state.chapterTotal=ch.time; state.remain=ch.time;
  state.chCorrect=0;
  drawDots();
  startTimer();
  renderQuestion();
}
function startTimer(){
  updateTimer();
  state.timerId=setInterval(()=>{
    state.remain--;
    updateTimer();
    if(state.remain<=0){expireChapter();}
  },1000);
}
function updateTimer(){
  const t=document.getElementById('timer');
  t.textContent=fmt(Math.max(0,state.remain));
  t.classList.toggle('low',state.remain<=30);
}
function expireChapter(){
  clearInterval(state.timerId);state.timerId=null;
  // כל שאלה שלא נענתה — נרשמת כטעות
  const ch=state.chapters[state.chIdx];
  for(let i=state.qIdx;i<state.qs.length;i++){
    logAnswer(ch,state.qs[i],false,0,false);
  }
  finishChapter(true);
}
function drawDots(){
  const d=document.getElementById('dots');

function renderQuestion(){
  const ch=state.chapters[state.chIdx];
  const q=state.qs[state.qIdx];
  state.selected=-1;
  state.qStart=Date.now();
  state.order=shuffle([0,1,2,3]);
  document.getElementById('secName').textContent=ch.name;
  document.getElementById('qCount').textContent='שאלה '+(state.qIdx+1)+' מתוך '+state.qs.length;

  let stem='';
  if(ch.skill==='sc'){
    stem='<p class="sub">בחר את המילה שמשלימה את המשפט בצורה הטובה ביותר:</p>'+
         '<div class="en">'+q.s.replace('___','<span class="blank">&nbsp;</span>')+'</div>';
  }else if(ch.skill==='rs'){
    stem='<p class="sub">בחר את המשפט הקרוב ביותר במשמעותו למשפט המקורי:</p>'+
         '<div class="en">'+q.s+'</div>';
  }else{
    const p=state.passage;
    stem=(state.qIdx===0?'<p class="sub">קרא את הקטע וענה על השאלות. הקטע יישאר מוצג לאורך כל הפרק.</p>':'')+
      '<div class="passage"><h3>'+p.title+'</h3>'+p.text.split('\n\n').map(t=>'<p>'+t+'</p>').join('')+'</div>'+
      '<div class="en"><b>'+(state.qIdx+1)+'.</b> '+q.s+'</div>';
  }
  app.innerHTML='<div class="card">'+stem+
    '<div class="opts">'+state.order.map((oi,vi)=>
      '<button type="button" class="opt" id="opt'+vi+'" onclick="pick('+vi+')">'+
      '<span class="letter">'+['A','B','C','D'][vi]+'</span><span>'+q.o[oi]+'</span></button>').join('')+
    '</div><div class="actions"><button class="btn" id="okBtn" disabled onclick="confirmAnswer()">אישור והמשך</button>'+
    '<span class="note">התשובה ננעלת — אין חזרה</span></div></div>';
}
function pick(vi){
  state.selected=vi;
  for(let i=0;i<4;i++)document.getElementById('opt'+i).classList.toggle('sel',i===vi);
  document.getElementById('okBtn').disabled=false;
}
function confirmAnswer(){
  const ch=state.chapters[state.chIdx];
  const q=state.qs[state.qIdx];
  const correct=state.order[state.selected]===q.c;
  const ms=Date.now()-state.qStart;
  logAnswer(ch,q,correct,ms,true);
  if(correct)state.chCorrect++;
  state.qIdx++;
  if(state.qIdx>=state.qs.length)finishChapter(false);
  else renderQuestion();
}
function logAnswer(ch,q,correct,ms,answered){
  const w=weight(q.d);
  state.maxSeen+=w;
  if(correct)state.earned+=w;
  state.log.push({skill:ch.skill,section:ch.name,d:q.d,layer:layerOf(q.d),
    tag:q.tag||'',correct,timeMs:ms,answered});
}
function finishChapter(expired){
  const ch=state.chapters[state.chIdx];
  state.chTimes.push({name:ch.name,used:state.chapterTotal-Math.max(0,state.remain),
    total:state.chapterTotal,expired});
  // אדפטיביות
  if(ch.skill==='sc')state.scBand=Math.min(5,Math.max(1,state.scBand+(state.chCorrect-2)));
  if(ch.skill==='rs'&&ch.name.includes('פרק 1'))state.rsCorrect=state.chCorrect;
  // מסך ביניים קצר
  if(state.chIdx<state.chapters.length-1){
    app.innerHTML='<div class="card" style="text-align:center"><h2>'+
      (expired?'⏱ נגמר הזמן — הפרק ננעל':'הפרק הושלם')+'</h2>'+
      '<p class="sub">הפרק הבא: '+state.chapters[state.chIdx+1].name+'</p>'+
      '<button class="btn" onclick="nextChapter()">המשך לפרק הבא</button>'+
      '<p class="note" style="margin-top:12px">במבחן האמיתי אין הפסקה — נסה לא להתעכב</p></div>';
    document.getElementById('timer').textContent='--:--';
    document.getElementById('timer').classList.remove('low');
  }else nextChapter();
}

function copyResult(btn){
  const r=window._result;
  const txt='תוצאת אבחון אמירנט — '+new Date(r.date).toLocaleString('he-IL')+'\n'+
    'ציון מוערך: '+r.score+' (פטור: 134)\n'+JSON.stringify(r);
  const done=()=>{btn.textContent='✓ הועתק — הדבק בשיחה';};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));
  }else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done,fail){
  const ta=document.createElement('textarea');ta.value=txt;
  document.body.appendChild(ta);ta.select();
  try{if(document.execCommand('copy'))done();else if(fail)fail();}catch(e){if(fail)fail();}
  document.body.removeChild(ta);
}

/* ============ מנוע חזרה מרווחת (Leitner) ============ */
const INTERVALS=[0,1,2,4,8,15,30]; // ימים לפי קופסה
const NEW_PER_DAY=20; // 2.8: הקצב הועלה מ-15. אם הרצף מחזיק שבועיים — 25
/* ⚠️ 4.8: היה toISOString() = תאריך UTC. המשתמש בישראל (UTC+3) — תרגול אחרי חצות
   נרשם ליום הקודם, והרצף נשבר על יום שכן תורגל. מפתח היום = תאריך מקומי בלבד. */
function dayKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayKey(){return dayKey(new Date());}
function srsLoad(){
  try{return JSON.parse(localStorage.getItem('amirnet_srs'))||{cards:{},log:{}};}
  catch(e){return {cards:{},log:{}};}
}
/* ⚠️ 4.8: היה try/catch שותק — אם הדפדפן חוסם אחסון (ספארי פרטי / מכסה מלאה),
   ההתקדמות נעלמה בלי שאף אחד ידע. עכשיו נרשם דגל שהדשבורד מציג. */
window._srsWriteFailed=false;
function srsSave(s){
  try{
    localStorage.setItem('amirnet_srs',JSON.stringify(s));
    // אימות אמיתי: לקרוא בחזרה. ספארי לפעמים "מצליח" לכתוב ולא שומר.
    if(!localStorage.getItem('amirnet_srs'))throw new Error('write-verify');
    window._srsWriteFailed=false;
  }catch(e){window._srsWriteFailed=true;}
}
function srsStats(){
  const s=srsLoad();const today=todayKey();
  let due=0,learning=0,mastered=0;
  for(const w in s.cards){
    const c=s.cards[w];
    if(c.b>=4)mastered++;else learning++;
    if(c.due<=today)due++;
  }
  /* רצף: ימים עוקבים עם פעילות, נגמר היום או אתמול.
     ⚠️ 16.8 — המשתמש: "רק ביום שבת לא עשיתי, אז הלך לי הרצף." זה היה באג ולא כלל:
     הלולאה עצרה בכל יום בלי רישום, ולכן **שבת אחת איפסה רצף של שבועיים**.
     מעכשיו שבת (getDay()===6) **מדולגת** — לא שוברת את הרצף ולא נספרת כיום תרגול.
     🔑 העיקרון: המערכת נבנית סביב איך שהוא באמת חי, לא סביב לוח שבעה ימים. */
  let streak=0;const d=new Date();
  if(!s.log[todayKey()]&&d.getDay()!==6)d.setDate(d.getDate()-1);
  for(;;){
    if(d.getDay()===6){d.setDate(d.getDate()-1);continue;}   // שבת — לדלג, לא לעצור
    if(!s.log[dayKey(d)])break;
    streak++;d.setDate(d.getDate()-1);
  }
  const totalDays=Object.keys(s.log||{}).length;
  return {due,learning,mastered,streak,totalDays,cards:Object.keys(s.cards||{}).length};
}
/* בניית סשן: חזרות שהגיע זמנן + מילים חדשות (העדיפות: מילים מהאבחון, אח"כ לפי רמה) */
const sess={queue:[],i:0,correct:0,wrong:0,newCount:0,revCount:0,order:[],phase:''};
function startSession(reviewsOnly){
  const s=srsLoad();const today=todayKey();
  const startedToday=(s.log[today]&&s.log[today].n)||0;
  const due=Object.keys(s.cards).filter(w=>s.cards[w].due<=today)
    .sort((a,b)=>s.cards[a].due<s.cards[b].due?-1:1).slice(0,40);
  // בלם עומס (מחקר): כשמצטברות הרבה חזרות — מורידים מילים חדשות, לא מדלגים על חזרות
  const dailyCap=due.length>=35?5:NEW_PER_DAY;
  const newWords=reviewsOnly?[]:WORDS.filter(x=>!s.cards[x.w])
    .sort((a,b)=>(b.pri||0)-(a.pri||0)||a.lv-b.lv)
    .slice(0,Math.max(0,dailyCap-startedToday));
  sess.queue=[
    ...due.map(w=>({word:WORDS.find(x=>x.w===w)||{w,t:'',ex:'',lv:0},isNew:false})),
    ...newWords.map(x=>({word:x,isNew:true,needLearn:true}))
  ];
  sess.i=0;sess.correct=0;sess.wrong=0;sess.newCount=newWords.length;sess.revCount=due.length;
  if(!sess.queue.length){
    app.innerHTML='<div class="card" style="text-align:center"><h2>🎉 סיימת להיום!</h2>'+
    '<p class="sub">אין חזרות שמחכות והשלמת את מנת המילים היומית. תחזור מחר — החזרה במרווחים היא כל הקסם.</p>'+
    '<button class="btn ghost" onclick="intro()">חזרה</button></div>';
    return;
  }
  nextSessItem();
}
function nextSessItem(){
  if(sess.i>=sess.queue.length){sessDone();return;}
  const item=sess.queue[sess.i];
  if(item.needLearn)renderLearn(item);else renderSessQuiz(item);
}
function renderLearn(item){
  const w=item.word;
  app.innerHTML='<div class="card" style="text-align:center">'+
    '<p class="sub">מילה חדשה · '+(sess.i+1)+' מתוך '+sess.queue.length+'</p>'+
    '<div class="en" style="font-size:2rem;font-weight:700;text-align:center">'+w.w+'</div>'+
    '<div style="font-size:1.3rem;font-weight:600;margin:6px 0">'+w.t+'</div>'+
    '<div class="en" style="text-align:center;color:var(--muted);font-size:1rem">"'+w.ex+'"</div>'+
    '<p class="note">קרא את המשפט, תגיד את המילה בקול — ואז נבדוק</p>'+
    '<button class="btn" onclick="learnDone()">הבנתי — תבחן אותי</button></div>';
}
function learnDone(){
  sess.queue[sess.i].needLearn=false;
  // הבוחן יגיע אחרי 2 פריטים — לא מיד אחרי החשיפה
  const item=sess.queue.splice(sess.i,1)[0];
  sess.queue.splice(Math.min(sess.i+2,sess.queue.length),0,item);
  nextSessItem();
}
function renderSessQuiz(item){
  const w=item.word;
  // מילה עקשנית (3+ כישלונות) — היפוך כיוון: עברית→אנגלית (מחקר: הכיוון הקשה מחזק את שניהם)
  const s=srsLoad();const card=s.cards[w.w];
  const reverse=!item.isNew&&card&&(card.laps||0)>=3;
  // מסיחים: מילים קרובות ברמה, מסוננות גם לפי המשמעות הראשונה (שלא ייכנס מסיח נרדף)
  const firstT=x=>x.split(/[;,]/)[0].trim();
  const cand=WORDS.filter(x=>x.w!==w.w&&x.t!==w.t&&firstT(x.t)!==firstT(w.t)&&Math.abs(x.lv-w.lv)<=1);
  const pool=shuffle(cand).slice(0,3);
  let opts=reverse?[w.w,...pool.map(x=>x.w)]:[w.t,...pool.map(x=>x.t)];
  sess.order=shuffle([0,1,2,3]);
  let stem=reverse
    ?'<div style="font-size:1.5rem;text-align:center;font-weight:700;margin:18px 0">'+w.t+'</div>'+
     '<p class="sub" style="text-align:center">🔁 מילה עקשנית — הפעם הפוך: איזו מילה באנגלית?</p>'
    :'<div class="en" style="font-size:1.9rem;text-align:center;font-weight:700;margin:18px 0">'+w.w+'</div>';
  let optStyle=reverse?'direction:ltr;text-align:left;font-family:Georgia,serif':'direction:rtl;text-align:right;font-family:inherit';
  /* 4.8 — צורה שלישית לאותה מילה: בחזרות, חלק מהפעמים המילה מגיעה **בתוך משפט**
     ולא כתרגום. תרגום = זיהוי; משפט = שימוש. המבחן בודק את השני. לא על מילה חדשה
     (עוד לא נלמדה) ולא על מילה עקשנית (שם ההיפוך חשוב יותר). */
  const sv=(!item.isNew&&!reverse&&Math.random()<0.45)?sentFor(w):null;
  if(sv){
    opts=sv.opts;
    stem=sentStem(sv,'📄 הפעם בתוך משפט — איזו מילה משלימה אותו?');
    optStyle='direction:ltr;text-align:left;font-family:Georgia,serif';
  }
  app.innerHTML='<div class="card">'+
    '<p class="sub">'+(item.isNew?'מילה חדשה':'חזרה')+' · '+(sess.i+1)+' מתוך '+sess.queue.length+'</p>'+
    stem+
    '<div class="opts">'+sess.order.map((oi,vi)=>
      '<button type="button" class="opt" style="'+optStyle+'" onclick="sessAnswer('+vi+','+oi+')">'+
      '<span class="letter">'+['א','ב','ג','ד'][vi]+'</span><span>'+opts[oi]+'</span></button>').join('')+
    '</div></div>';
  sess._opts=opts;
}
function sessAnswer(vi,oi){
  const item=sess.queue[sess.i];const w=item.word;
  const right=oi===0;
  const s=srsLoad();const today=todayKey();
  if(!s.log[today])s.log[today]={n:0,r:0,c:0,w:0};
  if(right){
    sess.correct++;s.log[today].c++;
    const c=s.cards[w.w]||{b:0,laps:0};
    if(item.isNew){c.b=1;c.seen=today;s.log[today].n++;} // seen = יום הלמידה, בשביל "משפטים על המילים של היום"
    else{c.b=Math.min(6,c.b+1);s.log[today].r++;}
    const d=new Date();d.setDate(d.getDate()+INTERVALS[c.b]);
    c.due=dayKey(d);
    s.cards[w.w]=c;srsSave(s);
    sess.i++;
    // פידבק קצר
    flashFeedback(true,w,()=>nextSessItem());
  }else{
    sess.wrong++;s.log[today].w++;
    if(!item.isNew){
      const c=s.cards[w.w];if(c){c.b=1;c.laps=(c.laps||0)+1;
        const d=new Date();d.setDate(d.getDate()+1);c.due=dayKey(d);}
    }
    // ⚠️ 4.8: השמירה הייתה רק בתוך ה-if — מי שטעה במילה חדשה בלבד ביום מסוים,
    // אותו יום לא נרשם ביומן בכלל והרצף נשבר. שומרים תמיד.
    srsSave(s);
    // המילה חוזרת לתור — עוד 3 פריטים
    const it=sess.queue.splice(sess.i,1)[0];it.isNew=item.isNew;
    sess.queue.splice(Math.min(sess.i+3,sess.queue.length),0,it);
    flashFeedback(false,w,()=>nextSessItem());
  }
}
function flashFeedback(ok,w,then){
  app.innerHTML='<div class="card" style="text-align:center">'+
    (ok?'<h2 style="color:var(--good)">✓ נכון!</h2>':'<h2 style="color:var(--bad)">✗ לא בדיוק</h2>')+
    '<div class="en" style="font-size:1.6rem;text-align:center;font-weight:700">'+w.w+'</div>'+
    '<div style="font-size:1.15rem;font-weight:600">'+w.t+'</div>'+
    '<div class="en" style="text-align:center;color:var(--muted)">"'+w.ex+'"</div>'+
    (ok?'':'<p class="note">המילה תחזור עוד כמה שאלות — עד שתשב</p>')+
    '<button class="btn" style="margin-top:10px" onclick="_ff()">המשך ←</button></div>';
  window._ff=then;
  // מקש Enter ממשיך
  const h=(e)=>{if(e.key==='Enter'){document.removeEventListener('keydown',h);then();}};
  document.addEventListener('keydown',h);
}
function sessDone(){
  const total=sess.correct+sess.wrong;
  const pct=total?Math.round(100*sess.correct/total):100;
  const st=srsStats();
  app.innerHTML='<div class="card" style="text-align:center">'+
    '<h2>🏁 סשן הושלם!</h2>'+
    '<div class="grid2" style="margin:14px 0;text-align:right">'+
    '<div class="stat"><div class="k">מילים חדשות</div><div class="v">'+sess.newCount+'</div></div>'+
    '<div class="stat"><div class="k">חזרות</div><div class="v">'+sess.revCount+'</div></div>'+
    '<div class="stat"><div class="k">דיוק</div><div class="v">'+pct+'%</div></div>'+
    '<div class="stat"><div class="k">🔥 רצף</div><div class="v">'+st.streak+' ימים</div></div>'+
    '</div>'+
    '<p class="sub">המילים שטעית בהן יחזרו מחר. אלה שידעת — בעוד יומיים-ארבעה. ככה הן נכנסות לזיכרון לטווח ארוך.</p>'+
    /* 4.8 — ההמשך הטבעי של הסשן: אותן מילים, הפעם בתוך משפטים. לפני השאלות
       הרשמיות של נית"ב, שהן קשות ועל מילים אחרות לגמרי. */
    (sess.newCount
      ?'<div class="card" style="text-align:right;border:1.5px solid var(--accent)"><b>📄 ההמשך של הסשן:</b> '+
       sess.newCount+' המילים שלמדת עכשיו — הפעם בתוך משפטים, כמו במבחן.'+
       '<div class="actions"><button class="btn" onclick="startWordSent(true)">▶ יאללה, משפטים על המילים שלי</button></div></div>'
      :'<div class="card" style="text-align:right;border:1.5px solid var(--accent)"><b>📄 ההמשך של הסשן:</b> המילים שלך בתוך משפטים — לזהות בהקשר, לא רק לתרגם.'+
       '<div class="actions"><button class="btn" onclick="startWordSent(false)">▶ משפטים על המילים שלי</button></div></div>')+
    (new Date().getDate()%2===0
      ?'<div class="card" style="text-align:right"><b>🏋️ עוד 5 דקות להיום:</b> השלמת משפטים — שאלות אמיתיות מהמבחן<div class="actions"><button class="btn" onclick="startSCP()">✏️ יאללה, 11 שאלות</button></div></div>'
      :'<div class="card" style="text-align:right"><b>🏋️ עוד 5 דקות להיום:</b> ניסוח מחדש — שאלות אמיתיות מהמבחן<div class="actions"><button class="btn" onclick="startRSP()">🎯 יאללה, 8 שאלות</button></div></div>')+
    '<button class="btn ghost" onclick="intro()">לא היום — חזרה למסך הבית</button></div>';
}

  <li><b>3. מילות קישור = מצפן.</b> however/but/although = היפוך כיוון. therefore/thus = המשך אותו כיוון. despite = ניגוד. אם לפני ה-but טוב — אחריו רע.</li>
  <li><b>4. פסילה לפני בחירה.</b> גם אם אתה לא יודע מה נכון — פסול מה שבטוח לא. נשארו 2? לך על המילה שנשמעת "אקדמית" יותר בהקשר רציני.</li>
  <li><b>5. תחיליות וסיומות עוזרות:</b> un/dis/mis = שלילי · re = שוב · over = יותר מדי · ‎-less = בלי · ‎-ful = מלא ב-. worthless = חסר ערך גם אם לא למדת את המילה.</li></ul>`},
 {icon:"🔁",title:"ניסוח מחדש — כאן המסיחים מלוכלכים (6 שאלות)",
  body:`<p>נותנים לך משפט + 4 גרסאות. שלוש מהן <b>מסלפות בכוונה</b>, וכך הן עושות את זה:</p>
  <ul class="rules">
  <li><b>היפוך שלילה:</b> המקור "hardly anyone came" (כמעט אף אחד) ← מסיח: "almost everyone came". שים לב ל-hardly, scarcely, barely — הן מילים <i>שליליות</i>.</li>
  <li><b>היפוך סיבה-תוצאה:</b> "בגלל א' קרה ב'" ← מסיח: "בגלל ב' קרה א'". תשאל את עצמך: מי גרם למי?</li>
  <li><b>שינוי כמות:</b> some↔all, few↔many, always↔sometimes. מילה אחת קטנה משנה הכל.</li>
  <li><b>תוספת שלא הייתה:</b> מסיח שנשמע הגיוני אבל מוסיף מידע שהמקור לא אמר. נכון בחיים ≠ נכון בשאלה.</li></ul>
  <p><b>השיטה:</b> שאל על המקור "מי עשה מה למי?" — ואז בדוק שכל תשובה משמרת את זה בדיוק. השווה <b>כל תשובה למקור</b>, לא תשובות אחת לשנייה.</p>
  <p><b>5 המלכודות (מנותחות מבחינות אמיתיות של המרכז הארצי):</b></p>
  <ul class="rules">
  <li><b>1. היפוך כיוון סיבתי</b> — "בזכות דיקנס הרומן הצליח" ← מסיח: "בזכות הרומן דיקנס הצליח". המלכודת הנפוצה ביותר!</li>
  <li><b>2. הזזת המגביל</b> — "המתכנן היחיד של הבית" ≠ "הבית היחיד שתכנן". ה-only זז למילה אחרת.</li>
  <li><b>3. עובדה ↔ דעה</b> — המקור אומר עובדה, המסיח מוסיף "is thought to / may be" (או הפוך).</li>
  <li><b>4. מידע שלא היה</b> — נשמע נכון בחיים, אבל המקור לא אמר את זה.</li>
  <li><b>5. שינוי כמת</b> — only 12% ↔ most, rarely ≠ never, few ≠ some.</li></ul>
  <p><b>תבניות שחוזרות:</b> אקטיב↔פסיב ("X is the leading cause of Y" ↔ "Y is most commonly caused by X") · החלפת מילות קישור (yet↔although, due to↔because of) · "It was because of X that Y" · "far from clear" ← "no one was sure".</p>`},
 {icon:"📖",title:"הבנת הנקרא — 15 דקות, 5 שאלות",
  body:`<ul class="rules">
  <li><b>קרא קודם את הקטע, לא את השאלות</b> — אבל קריאה חכמה: משפט ראשון של כל פסקה מקבל 100% ריכוז (שם הרעיון), השאר ברפרוף. ~3 דקות.</li>
  <li><b>התשובה תמיד בקטע.</b> לא מה שאתה יודע מהחיים, לא מה שהגיוני — מה שכתוב. מסיחים אוהבים להיות "נכונים בחיים אבל לא בקטע".</li>
  <li><b>שאלת רעיון מרכזי:</b> התשובה הנכונה מכסה את <i>כל</i> הקטע. מסיח קלאסי = פרט אמיתי מפסקה אחת שמוצג כאילו הוא הרעיון כולו.</li>
  <li><b>שאלת מילה בהקשר:</b> אל תענה מהזיכרון! חזור למשפט, מחק את המילה, ותראה איזו תשובה מתאימה לחור. לפעמים הפירוש הנכון הוא דווקא הפחות מוכר.</li>
  <li><b>ניהול זמן:</b> 3 דק' קריאה + ~2 דק' לשאלה = בדיוק 13-15. שאלה תקועה? נחש מושכל והמשך — עדיף לענות על כולן.</li></ul>`},
 {icon:"⏱️",title:"ניהול זמן ולחץ",
  body:`<ul class="rules">
  <li><b>השלמת משפטים:</b> דקה לשאלה. עברת דקה וחצי? פסול מה שאפשר, נחש, הלאה.</li>
  <li><b>ניסוח מחדש:</b> 2 דקות לשאלה. אלה שאלות שדורשות קריאה של 5 משפטים — אל תיבהל מזה.</li>
  <li><b>אל תסתכל על הטיימר אחרי כל שאלה</b> — רק בנקודות ביקורת: באמצע פרק, ולקראת הסוף.</li>
  <li><b>נשארו 30 שניות ויש שאלות פתוחות? ענה על הכל, גם בניחוש.</b> ריק = 0%. ניחוש = 25% מינימום.</li>
  <li><b>נשימה בין פרקים:</b> הזמן הוא פר-פרק — פרק גרוע לא "גונב" זמן מהבא. כל פרק הוא התחלה נקייה.</li></ul>`},
 {icon:"📅",title:"איך ללמוד נכון (המדע, בקצר)",
  body:`<ul class="rules">
  <li><b>10 דקות כל יום מנצחות שעתיים בשבת.</b> הזיכרון נבנה מחזרות מרווחות, לא ממרתונים. זה בדיוק מה שהתרגול היומי כאן עושה.</li>
  <li><b>להגיד בקול:</b> כשאתה לומד מילה חדשה — תגיד אותה + התרגום בקול. שמיעה+דיבור = עוד שני ווים בזיכרון.</li>
  <li><b>לחבר לחיים:</b> require — "הפוליסה requires חתימה". מילה שחיברת לעולם הביטוח שלך לא הולכת לשום מקום.</li>
  <li><b>טעויות = זהב.</b> מילה שטעית בה ונזכרת — נזכרת חזק יותר ממילה שידעת מיד. אל תתבאס מטעויות בתרגול, הן עושות את העבודה.</li>
  <li><b>אנגלית פסיבית בין סשנים:</b> סרטים עם כתוביות באנגלית, כותרות חדשות באנגלית. לא חובה — אבל כל חשיפה מוסיפה.</li></ul>`},
 {icon:"🎓",title:"יום המבחן",
  body:`<ul class="rules">
  <li><b>שבוע לפני:</b> רק חזרות וסימולציות — לא מילים חדשות. מגיעים עם ביטחון, לא עם עומס טרי.</li>
  <li><b>לילה לפני:</b> שינה מלאה. עייפות שווה יותר נקודות מכל מה שתלמד באותו לילה.</li>
  <li><b>במבחן:</b> הפרקים הראשונים בריכוז מקסימלי (שם נקבעת הרמה). שאלה קשה = אתה בכיוון הנכון.</li>
  <li><b>פרקי הפיילוט</b> (שמע/כתיבה אם יופיעו) — לא נספרים בציון. תעשה אותם רגוע, בלי להישחק.</li>

    '<p class="sub">לחץ על נושא לפתיחה. כדאי לחזור לכאן פעם בשבוע — דברים "נדלקים" אחרי שצוברים ניסיון בתרגול.</p></div>'+
    TIPS.map((t,i)=>'<div class="card" style="padding:0;overflow:hidden">'+
      '<button class="opt" style="direction:rtl;text-align:right;border:none;border-radius:0;font-family:inherit;font-size:1.05rem;font-weight:600;padding:16px 18px" onclick="toggleTip('+i+')">'+
      '<span>'+t.icon+' '+t.title+'</span></button>'+
      '<div id="tip'+i+'" class="hidden" style="padding:4px 20px 16px">'+t.body+'</div></div>').join('')+
    '<div class="card"><button class="btn ghost" onclick="intro()">→ חזרה למסך הבית</button></div>';
}
function toggleTip(i){document.getElementById('tip'+i).classList.toggle('hidden');}

/* ============ מבחני רמה + המסלול שלי (שיטת LexiBoost מותאמת) ============ */
/* מדד השאלות האמיתיות (4.8) — המשתמש עשה 11 שאלות נית"ב וקיבל 55%. מספר בודד
   אינו מדד; מה שמלמד הוא **המגמה**. לכן כל ריצה על שאלות אמת נשמרת ומוצגת במסלול,
   עם רף הפטור (~75%) כקו יעד. ⚠️ אותן שאלות חוזרות — עלייה בגלל שינון תיראה כאן
   כמו התקדמות אמיתית; לכן ההמלצה במסך היא להריץ במרווחים של שבוע, לא כל יום. */
function drillsLoad(){try{return JSON.parse(localStorage.getItem('amirnet_drills'))||[];}catch(e){return [];}}
function drillSave(kind,correct,total){
  try{
    const a=drillsLoad();
    a.push({date:todayKey(),kind,correct,total,pct:Math.round(100*correct/total)});
    localStorage.setItem('amirnet_drills',JSON.stringify(a.slice(-40)));
  }catch(e){}
}
function levelsLoad(){try{return JSON.parse(localStorage.getItem('amirnet_levels'))||{};}catch(e){return {};}}
function levelsSave(o){try{localStorage.setItem('amirnet_levels',JSON.stringify(o));}catch(e){}}
function levelStats(l){
  const s=srsLoad();
  const all=WORDS.filter(x=>x.lv===l);
  const learned=all.filter(x=>s.cards[x.w]);
  const mastered=learned.filter(x=>s.cards[x.w].b>=4);
  return {total:all.length,learned:learned.length,mastered:mastered.length,words:learned};
}
function simsList(){ // רק סימולציות מלאות (לא בדיקות מילים)
  try{return (JSON.parse(localStorage.getItem('amirnet_diag'))||[]).filter(r=>typeof r.score==='number');}
  catch(e){return [];}
}

const lvex={l:0,qs:[],i:0,correct:0,wrong:[],order:[]};
function startLevelExam(l){
  const st=levelStats(l);
  if(st.learned<20){
    app.innerHTML='<div class="card" style="text-align:center"><h2>🔒 עוד לא</h2>'+
      '<p class="sub">מבחן רמה '+l+' דורש לפחות 20 מילים שנלמדו ברמה הזאת (יש לך '+st.learned+' מתוך '+st.total+'). המשך בתרגול היומי — הוא יביא אותך לשם.</p>'+
      '<button class="btn ghost" onclick="showPath()">→ חזרה למסלול</button></div>';
    return;
  }
  lvex.l=l;lvex.qs=shuffle(st.words.slice()).slice(0,20);
  lvex.i=0;lvex.correct=0;lvex.wrong=[];
  renderLvexQ();
}
function renderLvexQ(){
  const w=lvex.qs[lvex.i];
  const firstT=x=>x.split(/[;,]/)[0].trim();
  const pool=shuffle(WORDS.filter(x=>x.w!==w.w&&x.t!==w.t&&firstT(x.t)!==firstT(w.t)&&Math.abs(x.lv-w.lv)<=1)).slice(0,3);
  const opts=[w.t,...pool.map(x=>x.t)];
  lvex.order=shuffle([0,1,2,3]);
  app.innerHTML='<div class="card">'+
    '<p class="sub">🏅 מבחן רמה '+lvex.l+' · שאלה '+(lvex.i+1)+' מתוך '+lvex.qs.length+' · צריך 90% לעבור</p>'+
    '<div class="en" style="font-size:1.9rem;text-align:center;font-weight:700;margin:18px 0">'+w.w+'</div>'+
    '<div class="opts">'+lvex.order.map((oi,vi)=>
      '<button type="button" class="opt" style="direction:rtl;text-align:right;font-family:inherit" onclick="lvexAnswer('+vi+')">'+
      '<span class="letter">'+['א','ב','ג','ד'][vi]+'</span><span>'+opts[oi]+'</span></button>').join('')+
    '</div></div>';
}
function lvexAnswer(vi){
  const w=lvex.qs[lvex.i];
  if(lvex.order[vi]===0)lvex.correct++;else lvex.wrong.push(w);
  lvex.i++;
  if(lvex.i>=lvex.qs.length){
    const pct=Math.round(100*lvex.correct/lvex.qs.length);
    const passed=pct>=90;
    if(passed){const L=levelsLoad();L[lvex.l]={passed:true,score:pct,date:new Date().toISOString().slice(0,10)};levelsSave(L);}
    app.innerHTML='<div class="card" style="text-align:center">'+
      (passed?'<h2 style="color:var(--good)">🏅 עברת! רמה '+lvex.l+' סגורה ('+pct+'%)</h2>'+
        '<p class="sub">הישג אמיתי — המילים האלה איתך. ממשיכים במסלול!</p>'
      :'<h2 style="color:var(--bad)">'+pct+'% — עוד לא 90%</h2>'+
        '<p class="sub">קרוב! המילים שנפלו יחזרו בתרגול היומי. חזור למבחן בעוד 3-4 ימים.</p>'+
        (lvex.wrong.length?'<table class="rep" style="text-align:right"><tr><th style="text-align:left">מילה</th><th>תרגום</th></tr>'+
          lvex.wrong.map(w=>'<tr><td style="direction:ltr;text-align:left;font-family:Georgia,serif">'+w.w+'</td><td>'+w.t+'</td></tr>').join('')+'</table>':''))+
      '<div class="actions" style="justify-content:center"><button class="btn" onclick="showPath()">→ חזרה למסלול</button></div></div>';
  }else renderLvexQ();
}

function showPath(){
  document.getElementById('topbar').style.visibility='hidden';
  const L=levelsLoad();
  const sims=simsList();
  const lvRow=(l)=>{
    const st=levelStats(l);
    const passed=L[l]&&L[l].passed;
    const pct=st.total?Math.round(100*st.learned/st.total):0;
    const canTest=st.learned>=20;
    return '<tr><td>רמה '+l+' — '+VOCAB_LEVEL_NAMES[l]+'</td>'+
      '<td>'+st.learned+' / '+st.total+' נלמדו ('+pct+'%)</td>'+
      '<td>'+(passed?'<span class="pill good">✅ עברת '+L[l].score+'%</span>'
        :canTest?'<button class="btn" style="padding:6px 14px;font-size:.9rem" onclick="startLevelExam('+l+')">🏅 מבחן רמה</button>'
        :'<span class="pill mid">🔒 עוד '+Math.max(0,20-st.learned)+' מילים</span>')+'</td></tr>';
  };
  // קביעת פאזה נוכחית
  const phaseA_done=L[2]&&L[2].passed&&L[3]&&L[3].passed;
  const risingSims=sims.length>=2&&sims[sims.length-1].score>sims[sims.length-2].score;
  const last2avg=sims.length>=2?(sims[sims.length-1].score+sims[sims.length-2].score)/2:0;
  const phaseB_done=phaseA_done&&sims.length>=2&&risingSims;
  const phase=phaseA_done?(phaseB_done?'ג':'ב'):'א';
  // המלצת סימולציות (כלל LexiBoost מותאם)
  let simRec='';
  if(sims.length===0)simRec=phaseA_done?'🎯 הגיע הזמן לסימולציה הראשונה! (במחשב, 39 דק\')':'סימולציות ייפתחו אחרי סגירת רמות 2-3 — קודם מילים.';
  else if(last2avg>=130)simRec='🚀 ממוצע 130+ בשתי האחרונות — אתה בטווח פטור. שווה להירשם למבחן האמיתי!';
  else if(sims[sims.length-1].score<110)simRec='ההמלצה: עוד שבועיים של מילים לפני הסימולציה הבאה — לבנות בסיס, לא להישחק.';
  else simRec='קצב נכון: סימולציה כל שבועיים. תמשיך במילים בין לבין.';
  const simBars=sims.slice(-6).map(s=>{
    const h=Math.max(8,Math.round((s.score-50)*0.8));
    return '<div style="display:inline-block;width:36px;margin:0 4px;text-align:center">'+
      '<div style="font-size:.75rem;font-variant-numeric:tabular-nums">'+s.score+'</div>'+
      '<div style="height:'+h+'px;background:'+(s.score>=134?'var(--good)':'var(--accent)')+';border-radius:3px 3px 0 0"></div>'+
      '<div style="font-size:.65rem;color:var(--muted)">'+s.date.slice(5,10).split('-').reverse().join('.')+'</div></div>';
  }).join('');
  const box=(letter,title,items,state)=>
    '<div class="card" style="border-right:4px solid '+(state==='now'?'var(--accent)':state==='done'?'var(--good)':'var(--line)')+'">'+
    '<h2>'+(state==='done'?'✅':state==='now'?'📍':'🔒')+' פאזה '+letter+' — '+title+(state==='now'?' <span class="pill good">אתה כאן</span>':'')+'</h2>'+
    '<ul class="rules">'+items.map(i=>'<li>'+i+'</li>').join('')+'</ul></div>';
  app.innerHTML='<div class="card"><h1>🗺️ המסלול שלי ל-134</h1>'+
    '<p class="sub">בשיטת השערים: לא תאריכים — הישגים. עוברים שער, ממשיכים הלאה. מומלץ להציץ כאן בתחילת כל שבוע.</p></div>'+
    box('א\'','בסיס המילים',[
      'תרגול יומי (~20 דק\') + 5 דקות שאלות אמת',
      '<b>השער:</b> מבחן רמה 2 ב-90%+ ואז מבחן רמה 3 ב-90%+'],phaseA_done?'done':'now')+
    '<div class="card"><h2>🏅 מבחני הרמה</h2><table class="rep"><tr><th>רמה</th><th>התקדמות</th><th>מצב</th></tr>'+
    [2,3,4,5].map(lvRow).join('')+'</table>'+
    '<p class="note" style="margin-top:8px">מבחן = 20 שאלות מהמילים שלמדת ברמה. 90% ומעלה = הרמה סגורה. נכשלת? המילים יחזרו בתרגול וחוזרים בעוד כמה ימים.</p></div>'+
    box('ב\'','שילוב סימולציות',[
      'ממשיכים מילים (רמות 4-5) + <b>סימולציה מלאה כל שבועיים</b> — במחשב, כמו במבחן האמיתי',
      '<b>השער:</b> שתי סימולציות עם מגמת עלייה'],phaseA_done?(phaseB_done?'done':'now'):'lock')+
    box('ג\'','חידוד אחרון',[

/* מחזיר שאלת-משפט למילה, או null אם אי אפשר לבנות אחת.
   גיבוי למילים שעדיין לא נכתב להן משפט ייעודי: משפט הדוגמה שכבר קיים בכרטיס. */
function sentFor(w){
  const it=SENT[w.w];
  if(it)return {s:it.s,opts:[w.w,...it.d],authored:true};
  if(!w.ex)return null;
  // הסתרת המילה במשפט הדוגמה — כולל הטיות: sit→sits · deny→denied · admit→admitted
  const esc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const b=w.w, forms=[esc(b)+'(s|es|ed|d|ing)?'];
  if(/y$/.test(b))forms.push(esc(b.slice(0,-1))+'i(es|ed)');          // deny → denied
  if(/[bcdfgklmnprstvz]$/.test(b))forms.push(esc(b)+b.slice(-1)+'(ed|ing)'); // admit → admitted
  const re=new RegExp('\\b('+forms.join('|')+')\\b','i');
  if(!re.test(w.ex))return null;
  const cand=WORDS.filter(x=>x.w!==w.w&&Math.abs(x.lv-w.lv)<=1&&!/\.\.\./.test(x.w));
  const pool=shuffle(cand).slice(0,3);
  if(pool.length<3)return null;
  return {s:w.ex.replace(re,'___'),opts:[w.w,...pool.map(x=>x.w)],authored:false};
}
function sentStem(q,note){
  return (note?'<p class="sub">'+note+'</p>':'')+
    '<div class="en">'+q.s.replace(/___/g,'<span class="blank">&nbsp;</span>')+'</div>';
}

  const s2=srsLoad();

    ((s2.cards[b.w]&&s2.cards[b.w].laps)||0)-((s2.cards[a.w]&&s2.cards[a.w].laps)||0));
  const q=[];
  for(const w of ordered){

  const right=wsent.order[vi]===0;
  const s=srsLoad();const today=todayKey();
  if(!s.log[today])s.log[today]={n:0,r:0,c:0,w:0};
  if(right){wsent.correct++;s.log[today].c++;}
  else{
    wsent.wrong++;s.log[today].w++;
    // ⚠️ טעות במשפט = המילה לא באמת יושבת. מחזירים אותה לחזרה מחר, בלי לאפס לגמרי.
    const c=s.cards[item.word.w];
    if(c){c.b=Math.max(1,Math.min(c.b,2));c.laps=(c.laps||0)+1;
      const d=new Date();d.setDate(d.getDate()+1);c.due=dayKey(d);}
  }
  srsSave(s);
  app.innerHTML='<div class="card">'+
    (right?'<h2 style="color:var(--good)">✓ נכון!</h2>':'<h2 style="color:var(--bad)">✗ התשובה: '+item.q.opts[0]+'</h2>')+
    '<div class="en">'+item.q.s.replace(/___/g,'<b style="color:var(--good)">'+item.q.opts[0]+'</b>')+'</div>'+
    '<div style="font-size:1.1rem;font-weight:600;margin-top:8px">'+item.word.w+' — '+item.word.t+'</div>'+
    (right?'':'<p class="note">המילה תחזור אליך מחר בחזרות</p>')+
    '<div class="actions"><button class="btn" onclick="wsentNext()">'+
    (wsent.i<wsent.queue.length-1?'הבא ←':'סיום')+'</button></div></div>';
}
function wsentNext(){
  wsent.i++;
  if(wsent.i>=wsent.queue.length){
    const tot=wsent.correct+wsent.wrong;
    const pct=tot?Math.round(100*wsent.correct/tot):0;
    if(tot)drillSave('ws',wsent.correct,tot);   // 16.8 — מזין את שער היומיים במסך הבית
    app.innerHTML='<div class="card" style="text-align:center"><h2>🏁 '+wsent.correct+' מתוך '+tot+' ('+pct+'%)</h2>'+
      '<p class="sub">'+(pct>=80?'המילים האלה כבר יושבות גם בתוך משפט — זה בדיוק מה שהמבחן בודק. 🎉'
        :pct>=60?'בכיוון. המילים שטעית בהן יחזרו אליך מחר בחזרות.'
        :'זה בדיוק הפער שסוגרים כאן — לזהות מילה בהקשר קשה יותר מלתרגם אותה. המילים האלה יחזרו מחר.')+'</p>'+
      '<button class="btn ghost" onclick="intro()">חזרה למסך הבית</button></div>';
  }else renderWordSent();
}

function startSCP(){
  document.getElementById('topbar').style.visibility='hidden';
  scp.i=0;scp.correct=0;renderSCPQ();
}
function renderSCPQ(){
  const q=SCP[scp.i];
  scp.order=shuffle([0,1,2,3]);
  app.innerHTML='<div class="card">'+
    '<p class="sub">השלמת משפטים — שאלות אמיתיות מבחינות המרכז הארצי · '+(scp.i+1)+' מתוך '+SCP.length+'</p>'+
    '<p class="sub">💡 קודם נסה לנחש את המילה בעברית, וקבע: חיובי או שלילי?</p>'+
    '<div class="en">'+q.s.replace('___','<span class="blank">&nbsp;</span>')+'</div>'+
    '<div class="opts">'+scp.order.map((oi,vi)=>
      '<button type="button" class="opt" onclick="scpAnswer('+vi+')">'+
      '<span class="letter">'+['A','B','C','D'][vi]+'</span><span>'+q.o[oi]+'</span></button>').join('')+
    '</div></div>';
}
function scpAnswer(vi){
  const q=SCP[scp.i];
  const right=scp.order[vi]===0;
  if(right)scp.correct++;
  app.innerHTML='<div class="card">'+
    (right?'<h2 style="color:var(--good)">✓ נכון!</h2>':'<h2 style="color:var(--bad)">✗ התשובה: '+q.o[0]+'</h2>')+
    '<div class="en">'+q.s.replace('___','<b style="color:var(--good)">'+q.o[0]+'</b>')+'</div>'+
    '<p><b>למה:</b> '+q.why+'</p>'+
    '<div class="actions"><button class="btn" onclick="scpNext()">'+
    (scp.i<SCP.length-1?'שאלה הבאה ←':'סיום')+'</button></div></div>';
}
function scpNext(){
  scp.i++;
  if(scp.i>=SCP.length){
    const pct=Math.round(100*scp.correct/SCP.length);
    drillSave('scp',scp.correct,SCP.length);
    app.innerHTML='<div class="card" style="text-align:center"><h2>🏁 '+scp.correct+' מתוך '+SCP.length+' ('+pct+'%)</h2>'+
      '<p class="sub">'+(pct>=75?'מעל רף הפטור (75%) על שאלות אמיתיות! 🎉':'רף הפטור ~75% — המילים מהתרגול היומי יסגרו את זה, תחזור לכאן בעוד שבוע')+'</p>'+
      '<button class="btn" onclick="intro()">חזרה למסך הבית</button></div>';
  }else renderSCPQ();
}

const rsp={i:0,correct:0,order:[]};
function startRSP(){
  document.getElementById('topbar').style.visibility='hidden';
  rsp.i=0;rsp.correct=0;renderRSPQ();
}
function renderRSPQ(){
  const q=RSP[rsp.i];
  rsp.order=shuffle([0,1,2,3]);
  app.innerHTML='<div class="card">'+
    '<p class="sub">ניסוח מחדש — שאלות אמיתיות מבחינות המרכז הארצי · '+(rsp.i+1)+' מתוך '+RSP.length+'</p>'+
    '<p class="sub">בחר את המשפט הקרוב ביותר במשמעותו:</p>'+
    '<div class="en">'+q.s+'</div>'+
    '<div class="opts">'+rsp.order.map((oi,vi)=>
      '<button type="button" class="opt" onclick="rspAnswer('+vi+')">'+
      '<span class="letter">'+['A','B','C','D'][vi]+'</span><span>'+q.o[oi]+'</span></button>').join('')+
    '</div></div>';
}
function rspAnswer(vi){
  const q=RSP[rsp.i];
  const oi=rsp.order[vi];
  const right=oi===0;
  if(right)rsp.correct++;
  app.innerHTML='<div class="card">'+
    (right?'<h2 style="color:var(--good)">✓ נכון!</h2>':'<h2 style="color:var(--bad)">✗ לא — נפלת במלכודת:</h2>')+
    (right?'':'<p><b>'+q.trap[oi]+'</b></p>')+
    '<div class="en" style="font-size:.95rem;color:var(--muted)">'+q.s+'</div>'+
    '<p class="sub">התשובה הנכונה:</p><div class="en" style="border-right:3px solid var(--good);padding-right:0;padding-left:10px;border-left:3px solid var(--good);border-right:none">'+q.o[0]+'</div>'+
    '<p class="sub" style="margin-top:10px">המסיחים והמלכודות שלהם:</p><ul class="rules" style="font-size:.88rem">'+
    q.trap.map((t,j)=>j===0?'':'<li><span class="en" style="font-size:.85rem">'+q.o[j]+'</span><br><b style="color:var(--bad)">← '+t+'</b></li>').join('')+
    '</ul><div class="actions"><button class="btn" onclick="rspNext()">'+
    (rsp.i<RSP.length-1?'שאלה הבאה ←':'סיום')+'</button></div></div>';
}
function rspNext(){
  rsp.i++;
  if(rsp.i>=RSP.length){
    const pct=Math.round(100*rsp.correct/RSP.length);
    drillSave('rsp',rsp.correct,RSP.length);
    app.innerHTML='<div class="card" style="text-align:center"><h2>🏁 '+rsp.correct+' מתוך '+RSP.length+' ('+pct+'%)</h2>'+
      '<p class="sub">'+(pct>=75?'מעל רף הפטור (75%) על שאלות אמיתיות — מצוין!':'רף הפטור הוא ~75% — תחזור לתרגול הזה בעוד כמה ימים, המלכודות נלמדות')+'</p>'+
      '<button class="btn" onclick="intro()">חזרה למסך הבית</button></div>';
  }else renderRSPQ();
}

/* ============ גיבוי / העברת התקדמות בין מכשירים ============ */
function showTransfer(){
  document.getElementById('topbar').style.visibility='hidden';
  app.innerHTML=`
  <div class="card">
    <h1>🔄 גיבוי / העברת התקדמות</h1>
    <p class="sub">ההתקדמות נשמרת בכל מכשיר בנפרד. כדי להעביר: העתק כאן קוד במכשיר הישן → הדבק במכשיר החדש.</p>
    <h2>ייצוא (מהמכשיר הזה)</h2>
    <p class="sub">מעתיק את כל ההתקדמות שלך כקוד — שלח לעצמך בוואטסאפ ופתח במכשיר השני.</p>
    <button class="btn" onclick="exportProgress(this)">📤 העתק קוד התקדמות</button>
    <h2 style="margin-top:22px">ייבוא (אל המכשיר הזה)</h2>
    <p class="sub">הדבק כאן קוד שהעתקת ממכשיר אחר. ⚠️ זה מחליף את ההתקדמות במכשיר הזה.</p>
    <textarea id="impBox" style="width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:10px;font-family:monospace;direction:ltr" placeholder="AMIRNET1:..."></textarea>
    <div id="impMsg" style="margin-top:10px;font-weight:600"></div>
    <div class="actions">
      <button class="btn" onclick="importProgress()">📥 ייבא לכאן</button>
      <button class="btn ghost" onclick="intro()">→ חזרה</button>
    </div>
  </div>`;
}
function exportProgress(btn){
  // מייצאים רק את מצב המילים (SRS) — קומפקטי, כדי שוואטסאפ לא יחתוך.
  // היסטוריית אבחונים נשארת במכשיר המקורי — לא נחוצה ללימוד היומי.
  const data={srs:localStorage.getItem('amirnet_srs')||''};
  const code='AMIRNET1:'+btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  // הקוד תמיד מוצג בתיבה — גם אם ההעתקה האוטומטית נחסמת, אפשר לסמן ולהעתיק ידנית
  const box=document.getElementById('impBox');
  if(box){box.value=code;box.focus();box.select();}
  const done=()=>{btn.textContent='✓ הועתק — שלח לעצמך והדבק במכשיר השני';};
  const fail=()=>{btn.textContent='✗ העתקה אוטומטית נחסמה — הקוד מסומן בתיבה למטה: העתק אותו ידנית (Ctrl+C)';};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done,()=>fallbackCopy(code,done,fail));
  }else fallbackCopy(code,done,fail);
}
function impSay(msg,ok){
  const el=document.getElementById('impMsg');
  if(el){el.textContent=msg;el.style.color=ok?'var(--good)':'var(--bad)';}
}
function importProgress(){
  // ניקוי: רווחים וירידות שורה (וואטסאפ שובר שורות), חיפוש הקוד גם אם הודבק עם טקסט מסביב
  const raw=(document.getElementById('impBox').value||'').replace(/\s+/g,'');
  const at=raw.indexOf('AMIRNET1:');
  if(at<0){impSay('✗ לא נמצא קוד שמתחיל ב-AMIRNET1: — ודא שהעתקת את כל ההודעה מוואטסאפ, מההתחלה ועד הסוף',false);return;}
  try{
    const data=JSON.parse(decodeURIComponent(escape(atob(raw.slice(at+9)))));
    if(data.srs)localStorage.setItem('amirnet_srs',data.srs);
    if(data.vocab)localStorage.setItem('amirnet_vocab',data.vocab);
    if(data.diag)localStorage.setItem('amirnet_diag',data.diag);
    impSay('✓ ההתקדמות יובאה בהצלחה! חוזר למסך הבית…',true);
    setTimeout(intro,1200);
  }catch(e){impSay('✗ הקוד חתוך או פגום — חזור למכשיר הראשון, העתק שוב ושלח מחדש (יכול להיות שוואטסאפ קיצר את ההודעה)',false);}
}

intro();
</script>
